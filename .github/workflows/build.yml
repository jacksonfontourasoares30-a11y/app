name: Gerar APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ProCam.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ProCam-apk
          path: ProCam.apk
      - name: Publicar para baixar no celular
        uses: softprops/action-gh-release@v2
        with:
          tag_name: procam-v${{ github.run_number }}
          name: ProCam (teste ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: ProCam.apk
          body: Baixe o ProCam.apk abaixo e instale no Android (permita "instalar apps desconhecidos").
